<div *ngIf="!ready" class="grid grid-cols-1 lg:grid-cols-2 gap-6 mt-6">
  <div *ngFor="let i of [1,2,3,4]"
       class="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-lg animate-pulse">
    <div class="h-5 bg-gray-300 dark:bg-gray-700 rounded w-1/3 mb-4"></div>
    <div class="h-[280px] bg-gray-200 dark:bg-gray-700 rounded"></div>
  </div>
</div>

<div *ngIf="ready" class="grid grid-cols-1 lg:grid-cols-2 gap-6 mt-6">
  <div class="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-lg">
    <h5 class="text-lg font-semibold text-gray-700 dark:text-gray-200 mb-4">Uso ao longo do tempo</h5>
    <div class="h-[280px]">
      <canvas baseChart [data]="overTimeCommands.data" [options]="overTimeCommands.options" type="line"></canvas>
    </div>
  </div>

  <div class="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-lg">
    <h5 class="text-lg font-semibold text-gray-700 dark:text-gray-200 mb-4">Usuários ativos por dia</h5>
    <div class="h-[280px]">
      <canvas baseChart [data]="overTimeUsers.data" [options]="overTimeUsers.options" type="line"></canvas>
    </div>
  </div>

  <div class="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-lg">
    <h5 class="text-lg font-semibold text-gray-700 dark:text-gray-200 mb-4">Horários de pico</h5>
    <div class="h-[280px]">
      <canvas baseChart [data]="byHour.data" [options]="byHour.options" type="bar"></canvas>
    </div>
  </div>

  <div class="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-lg">
    <h5 class="text-lg font-semibold text-gray-700 dark:text-gray-200 mb-4">Grupo vs privado</h5>
    <div class="h-[280px]">
      <canvas baseChart [data]="chatType.data" [options]="chatType.options" type="doughnut"></canvas>
    </div>
  </div>
</div>
