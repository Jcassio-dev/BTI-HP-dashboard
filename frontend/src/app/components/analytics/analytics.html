<div *ngIf="!ready" class="grid grid-cols-1 lg:grid-cols-2 gap-6 mt-6">
 <div *ngFor="let i of [1,2,3,4]"
 class="bg-card border border-rule rounded-sm p-6 animate-pulse">
 <div class="h-5 bg-rule rounded w-1/3 mb-4"></div>
 <div class="h-[280px] bg-rule rounded"></div>
 </div>
</div>

<div *ngIf="ready" class="grid grid-cols-1 lg:grid-cols-2 gap-6 mt-6">
 <div class="bg-card border border-rule rounded-sm p-6">
 <h5 class="t-secao text-ink mb-4">Uso ao longo do tempo</h5>
 <div class="h-[280px]">
 <canvas baseChart [data]="overTimeCommands.data" [options]="overTimeCommands.options" type="line"></canvas>
 </div>
 </div>

 <div class="bg-card border border-rule rounded-sm p-6">
 <h5 class="t-secao text-ink mb-4">Usuários ativos por dia</h5>
 <div class="h-[280px]">
 <canvas baseChart [data]="overTimeUsers.data" [options]="overTimeUsers.options" type="line"></canvas>
 </div>
 </div>

 <div class="bg-card border border-rule rounded-sm p-6">
 <h5 class="t-secao text-ink mb-4">Horários de pico</h5>
 <div class="h-[280px]">
 <canvas baseChart [data]="byHour.data" [options]="byHour.options" type="bar"></canvas>
 </div>
 </div>

 <div class="bg-card border border-rule rounded-sm p-6">
 <h5 class="t-secao text-ink mb-4">Grupo vs privado</h5>
 <div class="h-[280px]">
 <canvas baseChart [data]="chatType.data" [options]="chatType.options" type="doughnut"></canvas>
 </div>
 </div>
</div>
